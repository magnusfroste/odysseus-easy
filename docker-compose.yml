services:
  odysseus:
    # Official prebuilt upstream image — this repo carries only deployment
    # config, no source tree. Upstream publishes multi-arch (amd64/arm64)
    # images: :latest tracks main, :dev tracks dev, and 1.0.0-dev.<sha> tags
    # pin exact builds. Override via ODYSSEUS_TAG in the Easypanel env panel.
    # With pull_policy: always every redeploy fetches the newest build for
    # the tag — no fork syncing or local build needed.
    image: ghcr.io/pewdiepie-archdaemon/odysseus:${ODYSSEUS_TAG:-latest}
    pull_policy: always
    # Never publish a host port on an Easypanel host: Traefik routes the
    # service's Domain to the container port via the easypanel network below,
    # and a `ports:` binding makes a second instance fail with "port is
    # already allocated" while Easypanel still reports success — the same
    # lesson hermes-easy carries.
    expose:
      - "7000"
    # Everything typed into the Easypanel Environment panel lands in a .env
    # file beside this compose file. Loading it hands every panel variable to
    # the container, so a new key (an extra provider, an MCP server's token)
    # reaches Odysseus without editing this file. The explicit environment:
    # list below still wins for the same name. Optional, so a plain
    # `docker compose` run without a .env still starts. Same pattern as
    # openclaw-easy and hermes-easy.
    env_file:
      - path: .env
        required: false
    volumes:
      # Named volumes, not ./data bind mounts. A bind mount inside the
      # Easypanel checkout survives a normal Deploy but not a re-clone or a
      # service recreate, and it cannot be exported as a volume — the lesson
      # hermes-easy and skillhub already carry. Database, settings, sessions
      # and uploads all live in odysseus-data.
      - odysseus-data:/app/data
      - odysseus-logs:/app/logs
      # Cookbook remote-server SSH identity. Odysseus can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - odysseus-ssh:/app/.ssh
      # Cookbook local model cache. Inside Docker, "Local" means the Odysseus
      # container, so persist its HuggingFace cache.
      - odysseus-hf-cache:/app/.cache/huggingface
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - odysseus-local:/app/.local
      # Docker socket — lets Cookbook launch commands like
      # `docker exec ollama-rocm ollama show <tag>` reach the host's
      # Docker daemon (and sibling containers like ollama-rocm /
      # ollama-test). The in-container user needs to be in the
      # socket's owning group — see `group_add` below; the GID
      # there must match the host's `docker` group (defaults to 963
      # on Debian, 999 on Ubuntu — override via env if yours differs).
      # Upstream has since moved this mount into an opt-in overlay
      # (docker/host-docker.yml) and the app now ignores the socket unless
      # ODYSSEUS_ENABLE_HOST_DOCKER=true — set in environment: below, where
      # it defaults to true because the mount is baked in here. To turn host
      # Docker access off: remove this mount and group_add, and set
      # ODYSSEUS_ENABLE_HOST_DOCKER=false in the Easypanel env panel.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-963}"
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      # HTTP address advertised in companion/mobile pairing codes (LAN or
      # Tailscale IPv4, single-label hostname, or mDNS *.local the phone can
      # reach — HTTPS/public hostnames are not supported by the companion
      # client yet).
      - COMPANION_BASE_URL=${COMPANION_BASE_URL:-}
      # Gates Cookbook's host-Docker features (sibling-container exec etc.) on
      # the docker.sock mount above. Upstream default is false with no socket;
      # here the socket is baked in, so the feature is on unless you opt out.
      - ODYSSEUS_ENABLE_HOST_DOCKER=${ODYSSEUS_ENABLE_HOST_DOCKER:-true}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      # Left unset, Secure cookies follow the request scheme (HTTPS login →
      # Secure cookie). Forcing false keeps HTTPS logins on a non-Secure
      # cookie, so the old `:-false` default is gone — matches upstream.
      - SECURE_COOKIES=${SECURE_COOKIES:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_UPLOAD_MAX_BYTES:-104857600}
      - ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES=${ODYSSEUS_GALLERY_TRANSFORM_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_MEMORY_IMPORT_MAX_BYTES=${ODYSSEUS_MEMORY_IMPORT_MAX_BYTES:-10485760}
      - ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES=${ODYSSEUS_PERSONAL_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES=${ODYSSEUS_EMAIL_COMPOSE_UPLOAD_MAX_BYTES:-26214400}
      - ODYSSEUS_STT_MAX_AUDIO_BYTES=${ODYSSEUS_STT_MAX_AUDIO_BYTES:-26214400}
      - ODYSSEUS_ICS_MAX_BYTES=${ODYSSEUS_ICS_MAX_BYTES:-10485760}
      - ODYSSEUS_TTS_CACHE_MAX_BYTES=${ODYSSEUS_TTS_CACHE_MAX_BYTES:-}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      # Gmail OAuth for the email module — see .env.example for the Google
      # Cloud setup steps.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      # Externally reachable origin for MCP OAuth callbacks. The container
      # always listens on 7000 and cannot see how Traefik exposes it, so
      # remote MCP OAuth needs this set to the public https origin whenever
      # the browser reaches Odysseus on anything other than
      # http://localhost:7000. Not for Google MCP servers — see .env.example.
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so the volumes keep a consistent owner across image
      # updates). 1000 is fine on Easypanel; override only if you know
      # your host needs something else.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      default: {}
      easypanel:
        aliases:
          - app_odysseus_odysseus
    restart: unless-stopped

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # Pinned, not :latest — odysseus waits on searxng's healthcheck
    # (depends_on: condition: service_healthy), so a broken upstream `latest`
    # tag blocks the whole app from starting. 2026.6.2 crashes on boot with
    # `KeyError: 'default_doi_resolver'`, failing the healthcheck (issue #1414).
    # Bump this deliberately after verifying a newer tag boots clean.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        # Advisory: a settings file the migration cannot parse or rewrite must
        # not be what stops searxng from booting. It explains itself on stderr
        # and we carry on, letting searxng report anything genuinely wrong.
        /usr/local/searxng/.venv/bin/python /tmp/migrate-searxng-settings.py /etc/searxng/settings.yml || true
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
      # Vendored from upstream scripts/migrate_searxng_settings.py: makes a
      # settings.yml retained in the volume inherit new defaults instead of
      # blocking a searxng upgrade.
      - ./scripts/migrate_searxng_settings.py:/tmp/migrate-searxng-settings.py:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

volumes:
  # Easypanel prefixes these with the project/service name on disk.
  odysseus-data:
  odysseus-logs:
  odysseus-ssh:
  odysseus-hf-cache:
  odysseus-local:
  searxng-data:
  chromadb-data:
  ntfy-cache:

networks:
  easypanel:
    external: true
